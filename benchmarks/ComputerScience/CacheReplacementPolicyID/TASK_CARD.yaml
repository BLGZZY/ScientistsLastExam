invariants:
- the cache behind run and the machine the score compares against are the same policy; with the noise off the simulator and the minimised truth machine give the same outcome on every trace tested, and the thirteen deterministic worlds are pairwise inequivalent minimal machines of 15, 24 (four of them), 40, 78, 120, 128, 134, 255 and 720 (two) states
- the switch world agrees with LRU until six misses in a row; the shortest word that tells them apart is six misses, and the reference declines it
- the pooled determinism test is what keeps rare randomness from being claimed; over 24 re-drawn seeds its z at 32 traces stays at or below 2.55 in every deterministic world and at or above 5.83 in every randomised one, where at 24 traces the random victim once in 32 misses fell to 3.90; without the test the reference claims four randomised worlds on the graded seed and scores 0.333 and 0.000 held out
- a false machine costs one world wherever it is made, minus one in a deterministic world and zero where declining scores one; with every check removed the reference scores 0.000 with 81 false discoveries over eight seeds
- the reference leaves four deterministic development policies and two held out unclaimed, by design; a permutation-policy fit from eviction ranks under consecutive misses, added before L*, recovers two of them and one held out and scores 0.778 and 0.750 with no false discovery on eight seeds
- raising the claim cap claims nothing more; at 1024 states the reference scores 0.556 on the graded seed, averages 0.542 and 0.406 over eight seeds and claims three wrong machines, and at 64 or 128 states with 128 checks it matches the reference on the graded seed
- declining every world scores exactly zero by construction, and the closest textbook policy claimed everywhere scores zero; confidence feeds only the calibration axis
- runs are charged and overspend fails closed; the candidate receives a closure and not the ledger, so it cannot raise its own budget; the same trace run twice gives a fresh run and outcomes do not depend on the order of calls; malformed submissions and traces score zero and never raise out of the evaluator
- held-out split, per-world rows and the discovery axes remain evaluator-only
known_shortcuts: >-
  a 52-strategy sweep over blind textbook claims (7, all scoring zero), the textbook templates
  fitted to noisy traces at four mismatch tolerances with and without a check and the determinism
  tests (17, best 0.222 and 0.000 held out), the reference's age-table library alone (4, best
  0.222), a permutation-policy fit alone (6, best 0.333) and L* alone at claim caps of 8 to 1024
  states with 16 to 128 checks (18, best 0.444) tops out at 0.444 on the development split and
  0.250 held out, 80 per cent of the reference, with L* alone at a cap of 32 states; over eight
  re-drawn seeds that strategy averages 0.417 and 0.188 with three false discoveries
