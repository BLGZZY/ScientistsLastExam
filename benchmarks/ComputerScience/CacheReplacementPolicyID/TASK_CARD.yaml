    passed the per-position test; the pooled test on bursts and loops was added and the rarest
    randomised policies are 1/32 on development and 1/16 held out. With a 60-state five-way policy
    on the development split the reference with its cap raised tied the reference; that world is
    now a 720-state one. L* checked with 24 traces claimed a wrong 24-state machine on one
    prototype seed; it now uses 64. On the package's own evaluator the pooled test at 24 traces let
    the 1/32 policy through on two of 24 seeds, at z of 3.90 and 3.95; it now uses 32 traces.
    Task.md names no policy family.
