novelty_risk:
  level: medium
  rationale: Learning replacement policies from hardware is published, from permutation-policy inference by measurement (Abel and Reineke 2013, 2014) to active automata learning over a cache abstraction (Vila et al. 2020), and the learning algorithms are textbook (Angluin 1987; Rivest and Schapire 1993; Shahbaz and Groz 2009). A model that knows them will reach for L* and a template library at once. What is not published is which policies these are, that two of them are random rarely enough to pass a majority vote, that one differs from LRU only after six misses in a row, and how a budget of 200000 accesses has to be split between the determinism tests, the victim queries and the equivalence checks under noise. The ablation shows the score turns on combining the determinism tests, the library, L* and its checks rather than on any one of them, and the shortcut probe bounds what a searcher gets at 80 per cent of the reference. The reference's own headroom is deliberate and documented, since it stops L* at 32 states and knows no permutation policy. Task.md names no policy family. No frontier draw has been run yet, so the difficulty at the frontier is not measured.
