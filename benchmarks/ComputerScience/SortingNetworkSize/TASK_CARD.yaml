  edits_triggered_by_model: 2026-09-08 local build, before any frontier model saw the task. The
    malformed-candidate sweep caught the first verifier draft using an unbounded list(raw), which
    hangs on an infinite generator; replaced with an islice bounded by the n*n checker cap. The
    same sweep caught scalar returns (int/float/bool) sneaking through the iterable check, now
    rejected explicitly. A cross-check against brute-force random-network simulation pinned the
    0-1 bitmask checker and its subset-monotonicity direction (wires[w] subset of wires[w+1] for
    ascending output), which is easy to write backwards. The dual-sign normalization (fewer-is-better
    passed as negatives) was checked against the repository-wide uncapped helper contract. No
