schema_version: 2
scientific_question: Can a bounded shot program recover a supported acoustic velocity structure and refuse
  null or resolvably non-acoustic responses?
artifact: A bounded two-dimensional velocity grid, confidence and an optional model-inadequacy abstention.
oracle:
  model: deterministic constant-density 2-D acoustic finite differences with procedural smooth anomalies,
    no-anomaly nulls and both background-only and structurally anomalous attenuating out-of-family responses; waveform misfit is aligned and aggregated
    with NumPy
  feasibility: finite bounded velocity grids and strictly charged source acquisitions under a three-unit
    budget
  deterministic: true
  external_tooling: NumPy for fixed-grid time/receiver waveform alignment and reduction
difficulty_ladder:
  default_level: 1
  levels:
    1: working noise and anomaly count
    2: diagnostic only; 30 percent more observation noise and one additional anomaly; independent-noise CI-pinned local scores 0.597972/0.290042 development/heldout; not a validated difficulty tier
    3: diagnostic only; 65 percent more observation noise and two additional anomalies; independent-noise CI-pinned local scores 0.614944/0.330854 development/heldout; not a validated difficulty tier
normalization:
  baseline: one central shot followed by a confident background-velocity claim on every world
  reference: Standalone public-input acoustic inversion witness; algorithm and measured comparisons are recorded in references/known_best.md.
  score: background-relative depth-weighted structural skill (background or worse gives zero) and sealed-frequency waveform recovery normalized above always abstaining;
    refusal, calibration and held-out transfer remain separate
citations:
- id: doi:10.1190/1.3238367
  title: An overview of full-waveform inversion in exploration geophysics
- id: arxiv:2003.14181
  title: 'Wavefield Reconstruction Inversion: an example'
invariants:
- constant velocity produces stable finite waveforms and identical repeated traces
- exact supported velocity fields attain unit structural and sealed-waveform scores
- background and worse-than-background predictions receive zero structural skill
- structured attenuating worlds occur in both splits; at least one defeats the old global energy gate
- no-anomaly and attenuating responses reward refusal instead of fabricated structure
- every acquisition consumes budget and overspending fails closed
- held-out shots, frequencies, worlds and mechanism metrics remain evaluator-only
known_shortcuts: >-
  September 9 review completion on independent deterministic noise streams, under
  CI-pinned NumPy 1.24.4 and SciPy 1.10.1: previous reference 0.431671/0.299460,
  revised reference 0.714101/0.660180, one shot 0.341045/0.448163 development/heldout.
  Background classifier 0/0, fixed lens 0.140991/0.238192, travel-time-only
  0/0.027797. Independent 240-point spatial grid 0.042933/0.265730, 243-point
  refinement 0.419285/0.362910, greedy two anomalies 0.410611/0.140848, greedy
  three anomalies 0.184909/0.205779. Exact maintainer source was unavailable;
  these are explicit independently reconstructed probes, not exact-source replay.
  Refined spatial search reaches 58.7 percent and 55.0 percent of the new witness.
  On the same predeclared additional-world list, old/new references score
  0.137516/0.459219; four of twelve supported worlds remain refused.
  Current evidence is in references/review_method_diagnostics_2026-09-09.json
  and references/review_confirmation_2026-09-09.json. These are local method
  diagnostics, not domain certification or frontier calibration.
