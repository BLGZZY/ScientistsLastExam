novelty_risk:
  level: medium
  rationale: Geophysics/GravityInversion shares paid observations and model-inadequacy refusal, but fits potential-field parameters. This task recovers a second-order stress tensor and one of two nodal planes for each event, refusing mixed-regime and incoherent catalogs. WavePropagation/ActiveFullWaveformInversion instead returns a spatial velocity grid and predicts sealed waveforms. Public catalog construction remains a contamination risk; builder-model independence is not established.
