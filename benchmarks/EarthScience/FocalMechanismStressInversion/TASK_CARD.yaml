schema_version: 2
scientific_question: Can a noisy focal-mechanism catalog with two-fold nodal-plane ambiguity be resolved
  into one stress regime (axes, shape ratio, plane assignments), while refusing catalogs that mix regimes
  or carry no coherent signal?
artifact: Principal stress axes as (trend, plunge) pairs, the shape ratio R, a 0/1 plane choice per event,
  optional abstention and a confidence scalar.
oracle:
  model: Seeded normalized reduced stress tensors with eigenvalues (1,1-R,0); uniform spherical fault
    normals filtered by shear magnitude divided by tensor Frobenius norm; signed Wallace-Bott slips; independent
    Gaussian SDR noise followed by vector canonicalization; mixtures and incoherent catalogs. Axis orientation
    prior is not isotropic.
  feasibility: bounded mutually orthogonal principal-axis angles and R, a complete 0/1 plane row, charged
    unique re-analysis within a sixteen-credit budget
  deterministic: true
  external_tooling: NumPy oracle; NumPy and SciPy reference
difficulty_ladder:
  default_level: 3
  levels:
    1: 4-degree coarse noise, 1.2-degree re-analysis
    2: 6-degree coarse noise, 1.8-degree re-analysis
    3: 96 events, 10-degree coarse noise, 3-degree re-analysis, normalized shear floor 0.04, 16 credits
normalization:
  baseline: single un-iterated tensor fit on first-listed planes
  reference: Paired double-couple averaging, inverse-variance observation fusion, signed normalized-shear
    fit with global seeds and continuous refinement, ambiguous-event re-analysis, independent mean-residual
    refusal
  score: geometric mean of axis, shape-ratio and plane-assignment scores on supported worlds, normalized
    above always abstaining; false discovery and refusal separate
citations:
- id: doi:10.1029/JB089iB13p11517
  title: 'Determination of stress from slip data: Faults and folds'
- id: doi:10.1017/S0016756800059987
  title: The mechanics of oblique slip faulting
- id: doi:10.1093/gji/ggu224
  title: Iterative joint inversion for stress and fault orientations from focal mechanisms
invariants:
- the Wallace-Bott shear of the true tensor lies along every true slip direction
- both nodal planes of an event are perturbed independently and listed in seeded order
- axes are scored on absolute cosine so sign flips are free
- principal axes form a physical orthogonal frame, with absolute unit-vector dot at most 1e-6
- invalid artifacts do not count as discovery attempts and confidence tracks recovery quality
- a full abstention scores exactly zero after normalization
- re-analysis is charged, once per event, and overspending invalidates the world
