schema_version: 2
scientific_question: Can a structure-general policy order a fixed composite ply multiset to improve buckling
  and first-ply reserve while transferring across aspect ratios, load mixtures and orthotropic materials?
artifact: A symmetric balanced discrete ply-angle sequence with fixed composition and manufacturing constraints.
oracle:
  exact: Classical laminate A and D assembly and both-face Tsai-Hill first-ply calculation.
    Buckling is a Navier-inspired screening formula over modes 1 through 4 with an added
    absolute-shear denominator term; it is not an exact anisotropic shear-buckling solution.
  feasibility: Exact ply count and multiset, allowed angles, symmetry, balance, and maximum consecutive
    equal plies; malformed values fail closed.
  deterministic: true
  model: Classical symmetric laminate A/D assembly; paired membrane and bending loads; both-face Tsai-Hill
    failure and reduced Navier buckling screening.
normalization:
  baseline: Quasi-isotropic largest-remaining-first interleaved sequence satisfying every
    manufacturing rule.
  reference: Thirteen seeded permutation starts followed by up to eight adjacent-exchange
    sweeps, stopping on convergence; after the 2026-09-08 normal-load sign correction it scores 0.739886
    development and 0.890954 heldout against the oracle's tiled-block-seeded, multi-start
    full pair-exchange plus iterated-local-search anchor. All search budgets are unchanged.
  score: Development reserve improvement is uncapped above the stronger search anchor; held-out
    panels and sealed material/load degradation remain separate.
evaluation_budget: 300 s candidate timeout (frontier_eval/run_eval.py); metadata declares a
  45 s envelope. On 2026-09-08 the corrected-model baseline evaluation including all six
  anchor searches took 27.03 s and the full public reference took another 0.46 s with the
  anchor cached on macOS Python 3.12 / NumPy 1.26.4. These are local diagnostics; Linux
  sandbox timing remains pending. Previous 2026-09-07 timings predate the sign correction.
citations:
- id: doi:10.2514/3.11710
  title: Optimization of laminate stacking sequence for buckling load maximization by genetic algorithm
- id: doi:10.1016/j.compstruct.2016.01.052
  title: An improved genetic algorithm for optimal design of composite laminates
- id: https://ntrs.nasa.gov/citations/19950009349
  title: Nettles, Basic Mechanics of Laminated Composite Plates, NASA RP-1351, sections III.C-D
invariants:
- Public Nx and Ny are positive in compression; CLT uses tensile-positive normal stress via
  A inverse times [-Nx, -Ny, Nxy]. Signed engineering shear and moment resultants are unchanged.
- Extensional stiffness is invariant to sequence permutations with fixed ply counts while bending stiffness
  is not.
- Symmetric balanced sequences have vanishing bending-extension coupling and paired off-axis counts.
- Malformed, asymmetric, unbalanced, composition-changing and over-consecutive sequences score zero without
  escaping the evaluator.
- Held-out and degradation metrics never control combined_score.
known_shortcuts: 'Historical 2026-09-07 diagnostics measured a 0.372152 development
  lamination-parameter greedy family and a 0.557119 clustered/block family against the then
  0.740840 reference. Those values, their gap-to-reference claims and start-count ablations
  predate the 2026-09-08 compression/tension sign correction and are invalid as calibration
  for the current oracle. Updated shortcut and capability calibration is pending. The full
  unchanged reference now scores 0.739886 development and 0.890954 heldout. Fixed ply counts
  remove composition optimization; the CLT/Navier surrogate omits holes, delamination,
  postbuckling and anisotropic mode coupling. Local sign-limit tests establish consistency
  with force balance, not high-fidelity validation or expert difficulty.'
