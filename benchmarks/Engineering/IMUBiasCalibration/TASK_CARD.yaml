schema_version: 2
scientific_question: Can an agent allocate a limited pose-temperature experiment budget to recover a twelve-parameter accelerometer calibration and attribute noise-overlapping non-affine faults to their response axes?
artifact: Three bias components, three thermal-drift components, an upper-triangular scale/non-orthogonality matrix, three transfer predictions, a fault type and axis, confidence and acquired query evidence.
oracle:
  proxy: approximate D-optimal experimental design, weighted triangular calibration and known-noise nested Gaussian model comparison with multiplicity correction
  nominal: deterministic pose-temperature measurement callback with heteroscedastic Gaussian noise, twelve supported coefficients and one quadratic thermal, temperature-dependent cross-axis or orientation-dependent parasitic-acceleration fault
  feasibility: eighteen paid vector measurements, sticky protocol violations, finite arrays, positive upper-triangular calibration matrix, valid diagnosis/axis pair and exactly the acquired evidence IDs
  deterministic: true
normalization:
  baseline: confidently trust identity factory calibration and zero bias/drift without measuring; valid and zero
  reference: truth-blind information-driven design, weighted twelve-parameter fit, nested-model fault attribution and transfer prediction
  score: supported correct-claim quality plus correct fault refusal, minus the maximum blanket-refusal reward, divided by supported count and multiplied by correct-refusal rate; four discovery axes and counts are reported separately
citations:
- id: doi:10.48456/tr-696
  title: An introduction to inertial navigation
  url: https://www.cl.cam.ac.uk/techreports/UCAM-CL-TR-696.html
- id: doi:10.4153/CJM-1960-030-4
  title: The Equivalence of Two Extremum Problems
- id: doi:10.1214/aoms/1177732360
  title: The Large-Sample Distribution of the Likelihood Ratio for Testing Composite Hypotheses
invariants:
- stationary means follow the declared upper-triangular calibration, bias and linear temperature drift in supported worlds
- orientations are known unit vectors; transfer poses and two extrapolated temperatures differ from the measurement catalog
- quadratic thermal, temperature-dependent cross-axis and orientation-dependent parasitic acceleration are distinct unsupported mechanisms, each present in both splits
- eighteen charged measurements; repeats cost one and redraw noise; caught overrun or invalid-setting errors still invalidate
- every acquired vector has an immutable query ID; no free acceleration table is supplied
- the baseline is valid and scores zero by construction
- malformed, non-finite, incomplete and extra-key submissions fail closed
- held-out worlds use different seeds, parameters and fault placement from development
- reference output is generated from public records without reading hidden world labels
known_shortcuts: Two registered 900-policy residual-RMS/peak threshold grids use sequential and information-designed measurements; compare their replayed maxima against the reference before admission. Constant factory calibration, blanket refusal and never-refusing fits must score zero. Procedural worlds and a declared finite fault family still require independent review and server-held tests.
