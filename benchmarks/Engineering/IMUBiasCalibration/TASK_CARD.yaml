schema_version: 2
scientific_question: Can an agent recover triaxial inertial-sensor bias and temperature drift from static gravity observations while refusing nonlinear thermal response, cross-axis misalignment and motion contamination?
artifact: Three bias components, three temperature-drift components, a sealed-temperature acceleration prediction, a fault diagnosis, confidence and immutable record evidence.
oracle:
  proxy: ordinary least-squares affine bias/drift fit with sparse-outlier, quadratic-temperature and orientation-coupling diagnostics
  nominal: deterministic six-orientation, four-temperature accelerometer generator with Gaussian measurement noise and three unsupported fault families
  feasibility: exact finite vectors, bounded confidence, one allowed diagnosis, complete unique evidence IDs and finite values
  deterministic: true
normalization:
  baseline: zero calibration with valid undetermined abstention
  reference: truth-blind affine fit, residual-based fault classification and sealed-temperature prediction
  score: supported correct-claim quality plus correct fault refusal, minus the maximum blanket-refusal reward, divided by supported count and multiplied by correct-refusal rate; four discovery axes and counts are reported separately
citations:
- id: doi:10.48456/tr-696
  title: An introduction to inertial navigation
  url: https://www.cl.cam.ac.uk/techreports/UCAM-CL-TR-696.html
invariants:
- stationary observations equal gravity plus additive bias and temperature drift in supported worlds
- orientations are known unit vectors and the prediction temperature is outside the central calibration pair
- quadratic thermal response, cross-axis matrix error and motion contamination are distinct unsupported mechanisms
- every record has an immutable ID and candidates cannot fabricate evidence IDs
- the baseline is valid and scores zero by construction
- malformed, non-finite, incomplete and extra-key submissions fail closed
- held-out worlds use different seeds, parameters and fault placement from development
- reference output is generated from public records without reading hidden world labels
known_shortcuts: The reduced-order laboratory omits coning, gyro coupling, scale-factor nonlinearity, vibration rectification and thermal hysteresis. The fixed public generator requires a future server-held split. The reference is an evaluation anchor, not a claim of field IMU calibration accuracy.
