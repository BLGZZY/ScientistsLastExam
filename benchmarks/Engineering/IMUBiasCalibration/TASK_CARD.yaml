novelty_risk:
  level: medium
  rationale: StructuralEngineering/ModalDamageAttribution uses temperature-invariant modal ratios to localize structural damage; this task must jointly identify a sensor tensor and thermal drift while designing discriminating poses and temperatures. HeatTransfer/ConvectionDiffusionOpt couples PDE identification to heater design; Sensors/QuartzCrystalMicrobalanceLab uses resonance admittance and deposition. Neither has this triangular inertial-calibration artifact or response-axis fault localization. The former passive version was on-ramp difficulty and is superseded by the active contract.
