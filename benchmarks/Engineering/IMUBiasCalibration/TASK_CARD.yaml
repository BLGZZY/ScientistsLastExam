novelty_risk:
  level: medium
  rationale: StructuralEngineering/ModalDamageAttribution is the nearest in temperature confounding and out-of-family refusal, but localizes structural damage using budgeted modal measurements. HeatTransfer/ConvectionDiffusionOpt infers transport and designs heaters using charged PDE experiments. Sensors/QuartzCrystalMicrobalanceLab reconstructs QCM admittance and deposition. This task instead recovers accelerometer bias/drift from a supplied static vector table; the simpler, unbudgeted OLS setting may be on-ramp difficulty and still requires independent admission review.
