schema_version: 2
scientific_question: How much of the gap between the NEH construction and a frozen
  iterated-local-search witness can a searcher close on fresh-seeded permutation flow
  shops, and can it beat the witness?
artifact: One job permutation per instance; the makespan is simulated exactly in
  integers.
oracle:
  model: deterministic Taillard-style fresh-seeded instances (processing times uniform
    on {1..99}), exact integer completion-time simulation, gap normalization against
    a NEH zero anchor recomputed per instance and a frozen witness search
  feasibility: a permutation listing every job index exactly once
  deterministic: true
  external_tooling: none beyond NumPy
difficulty_ladder:
  default_level: 1
  levels:
    1: four development sizes (20x5, 30x10, 50x5, 50x10) with the frozen witness anchor
normalization:
  baseline: the NEH construction computed inside the oracle (zero anchor); the
    as-given order clips to zero as well
  reference: NEH plus seeded ILS with accelerated integer insertion evaluation;
    3000 iterations define the original score-one witness. The runnable reference
    now performs 128 cycles and scores 0.982759 development / 0.963889 heldout.
    The 2026-09-08 256-cycle diagnostic gives the same scores. The former one-cycle
    0.636 reference materially understated standard search and is historical.
  score: mean NEH-to-record gap closed per instance; beating the frozen 3000-iteration
    record anchor scores above one with no cap
evaluation_budget: 180 s declared evaluation envelope and a 300 s candidate timeout
  (EVAL_TIMEOUT_S in frontier_eval/run_eval.py, which delegates to sle eval). The
  128-cycle vectorized reference took 141.1 s in a local direct evaluation while
  other diagnostics shared the CPU; this is not a clean Linux guarantee. Original-
  loop 64/128/256-cycle trajectories took 75.7/144.9/287.8 s and the 128/256 scores
  were identical, motivating the fixed 128-cycle budget. No score target was used
  to weaken the method. The earlier 236 s / 400-cycle and subsecond / one-cycle
  measurements describe historical implementations.
citations:
- id: doi:10.1016/0377-2217(93)90182-M
  title: Benchmarks for basic scheduling problems
- id: doi:10.1287/ijoc.2022.1193
  title: Exactly solving hard permutation flowshop scheduling problems
invariants:
- verification is integer simulation independent of the construction method
- fresh seeds mean no published table or memorized solution transfers
- the as-given order scores exactly zero and the witness exactly one
known_shortcuts: >-
  NEH alone is the zero anchor. Historical local measurements give 0.849/0.805
  development/heldout for two ILS iterations and 0.929/0.957 for twenty, already
  above the historical one-cycle reference (0.636/0.773). The current 128-cycle
  reference reaches 0.982759/0.963889, with 256 cycles giving the same result. The
  near-ceiling standard-method plateau leaves the expert-difficulty gate unresolved. Priority-rule,
  tie-breaking and bounded multi-start probes remain relevant for a permutation
  artifact. The 2026-09-08 review also fixed fractional-index truncation (an invalid
  repeated-job submission previously scored 15.675 development) and mutation of the
  scoring input in direct evaluation. Local regressions are not frozen evidence.
