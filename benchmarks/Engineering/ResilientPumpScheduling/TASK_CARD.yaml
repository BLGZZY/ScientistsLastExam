schema_version: 2
scientific_question: Can one open-loop pumping policy reduce tariff-weighted energy while respecting pressure,
  storage and terminal recovery and retaining service under demand growth and pump outage?
artifact: A 24-hour hybrid on/off and stable-speed schedule with minimum runs and on-to-on ramps.
oracle:
  model: Deterministic extended-period mass balance, tank-head remote-pressure calculation and speed-dependent
    pump energy model. Electrical auxiliary load and off-to-on startup charges couple discrete commitment
    with continuous dispatch.
  feasibility: Hourly tank bounds, remote pressure at least 20 metres, terminal storage recovery, finite
    speed bounds and ramp limits. Running speeds >=0.65 and on-runs >=2 hours.
  deterministic: true
normalization:
  baseline: Conservative constant-speed schedule sized above mean public demand.
  reference: Two complete width-2/3/4 commitment sweeps with convex public-band dispatch
    and warm starts; the current local score is approximately 0.977067 development /
    0.989029 heldout against an independent mixed-integer global-commitment feasible
    witness. The anchor refines the chosen mask with exact convex dispatch and scores
    its actual cost, never the relaxation bound. The older all-on 0.630 method is historical
    and omitted the task's central commitment dimension.
  score: Development energy-cost savings are uncapped above the feasible global-commitment anchor; held-out
    systems, demand growth and four-hour outage resilience remain separate.
evaluation_budget: 150 s expected evaluation time (frontier_eval/metadata.yaml) and a
  300 s candidate timeout (EVAL_TIMEOUT_S in frontier_eval/run_eval.py). A direct local
  evaluation on 2026-09-07 with the twelve-system set took 41.1 s for the baseline entry
  (including every anchor search, cached thereafter) and 0.2 s for the runnable reference;
  warm-starting every fixed-mask dispatch from the incumbent schedule is what holds the
  repeated-sweep anchor inside that cost. These are historical in-process measurements,
  not a clean Linux budget guarantee. The maintainer previously observed a 2.3x slower
  host (79 s vs 34.8 s on the six-system set); current sandbox replay must verify the
  whole-evaluation envelope on the target host.
citations:
- id: url:https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=P10113EM.TXT
  title: EPANET 2.2 User Manual
- id: doi:10.5194/dwes-7-53-2014
  title: A multiobjective approach to optimal pump scheduling in water distribution systems
invariants:
- Tank volume equals initial storage plus cumulative pump inflow minus cumulative actual demand.
- Pump power is nonnegative and increases with delivered flow and head.
- Invalid shapes, nonfinite speeds, bound violations, ramp violations and nominal hydraulic failures score
  zero.
- Forecast growth and outage axes remain evaluator-only.
- The true demand is the public forecast times a hidden two-frequency ripple whose amplitudes,
  frequencies and phase constant live only in the instance spec; it is deterministic, not
  reconstructible from the public problem (the visible phase no longer seeds it), and its peak
  stays inside the +-4.5% band the public-band reference dispatches against, so band-robust
  public schedules remain feasible on actual demand.
known_shortcuts: >-
  Historical constant-speed price-window and threshold families failed closed, while
  two-block commitment with convex dispatch scored 0.607706 development. The old
  0.629968 all-on reference omitted commitment search and was too weak. The 2026-09-08
  capability ladder gives 0.974300/0.944775 for one complete block-exchange sweep and
  1.000/1.000 for two, matching the historical four-sweep anchor. The runnable reference
  now performs two sweeps. Independent global commitment search improves five systems
  and supplies a feasible stronger anchor, against which the reference remains near
  saturation at approximately 0.977067/0.989029. The public-band feasible costs lie
  within 0.0016 USD of tangent-relaxation lower bounds; these are scoped diagnostics,
  not a real-network or unrestricted nominal optimum certificate. No score formula
  or physical coefficient was changed to force the reference below the ceiling. Standard-search saturation remains an unresolved expert-
  difficulty issue, not an admission result. These are local diagnostics, not frozen
  Linux model calibration; independent water-systems review is pending.
