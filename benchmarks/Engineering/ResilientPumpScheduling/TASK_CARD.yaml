schema_version: 2
scientific_question: Can one open-loop pumping policy reduce tariff-weighted energy while respecting pressure,
  storage and terminal recovery and retaining service under demand growth and pump outage?
artifact: A 24-hour hybrid on/off and stable-speed schedule with minimum runs and on-to-on ramps.
oracle:
  model: Deterministic extended-period mass balance, tank-head remote-pressure calculation and speed-dependent
    pump energy model. Electrical auxiliary load and off-to-on startup charges couple discrete commitment
    with continuous dispatch.
  feasibility: Hourly tank bounds, remote pressure at least 20 metres, terminal storage recovery, finite
    speed bounds and ramp limits. Running speeds >=0.65 and on-runs >=2 hours.
  deterministic: true
normalization:
  baseline: Conservative constant-speed schedule sized above mean public demand.
  reference: Convex public-band dispatch on a conservative all-on commitment; it scores 0.641
    against the oracle's one-sweep block-exchange commitment anchor on the twelve-system set.
  score: Development energy-cost savings are uncapped above the block-search anchor; held-out
    networks, demand growth and four-hour outage resilience remain separate.
evaluation_budget: 150 s expected evaluation time (frontier_eval/metadata.yaml) and a
  300 s candidate timeout (EVAL_TIMEOUT_S in frontier_eval/run_eval.py). A direct local
  evaluation on 2026-09-07 with the twelve-system set took 62.1 s for the baseline entry
  (including every anchor search, cached thereafter) and 0.5 s for the runnable reference.
  The anchor was reduced from two block-exchange passes to one deterministic sweep (widths 2-4)
  to hold that cost down when the instance count doubled; the maintainer previously observed a
  2.3x slower host (79 s vs 34.8 s on the six-system set), so the declared envelope anticipates
  slower machines while the 300 s wrapper still leaves well over half the budget to the candidate.
citations:
- id: url:https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=P10113EM.TXT
  title: EPANET 2.2 User Manual
- id: doi:10.5194/dwes-7-53-2014
  title: A multiobjective approach to optimal pump scheduling in water distribution systems
invariants:
- Tank volume equals initial storage plus cumulative pump inflow minus cumulative actual demand.
- Pump power is nonnegative and increases with delivered flow and head.
- Invalid shapes, nonfinite speeds, bound violations, ramp violations and nominal hydraulic failures score
  zero.
- Forecast growth and outage axes remain evaluator-only.
- The true demand is the public forecast times a hidden two-frequency ripple whose amplitudes,
  frequencies and phase constant live only in the instance spec; it is deterministic, not
  reconstructible from the public problem (the visible phase no longer seeds it), and its peak
  stays inside the +-4.5% band the public-band reference dispatches against, so band-robust
  public schedules remain feasible on actual demand.
known_shortcuts: 'Measured 2026-09-07 on the twelve-system set: the conservative constant-speed
  baseline scores 0. Fixed-price-window charging (k cheapest hours, constant speed, k swept 12-22)
  and threshold commitment (run iff price < tau, constant speed, tau swept) both fail closed on
  development (0.0, valid=0: no member is simultaneously tank-, pressure- and terminal-feasible
  on every development system). Two-block commitment with public-band convex dispatch on each
  mask reaches 0.629644 development, just below the 0.640556 all-on witness but not the anchor,
  so discrete commitment remains genuine search headroom. Single-pump/single-tank fidelity and
  global optimality remain limited; clean Linux replay and independent water-network review are
  pending.'
