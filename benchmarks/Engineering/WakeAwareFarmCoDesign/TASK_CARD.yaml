schema_version: 2
scientific_question: Can one policy jointly place turbines and schedule direction-dependent yaw to improve
  annual farm value while transferring across wind roses, boundaries and wake-model uncertainty?
artifact: A continuous two-dimensional turbine layout and a direction-by-turbine yaw matrix.
oracle:
  model: Deterministic Gaussian and Jensen hybrid wake superposition with yaw deflection, own-power loss,
    rated-power cap and wind-rose integration.
  feasibility: Exact shapes, finite values, rectangular boundary, pairwise minimum spacing and yaw bounds;
    violations fail closed.
  deterministic: true
normalization:
  baseline: Regular rectangular grid with zero yaw.
  reference: Ten seeded layout starts, coordinate yaw search and one 80 m feasible layout-refinement
    scale; it scores 0.742 development against the oracle's 180-start, three-scale anchor.
  score: Development annual-value gain is scored under the PUBLIC wake expansion (wake_expansion_public,
    0.055) exactly as published in Task.md, uncapped above the stronger search anchor; held-out
    geometries and the widened-expansion/rotated-direction/turbulence tier stay separate and never
    control combined_score.
citations:
- id: doi:10.1088/1742-6596/1618/2/022028
  title: Overview of FLORIS updates
- id: url:https://nrel.sitefinity.cloud/wind/floris
  title: NREL FLORIS wake modeling and controls software
invariants:
- With wake interaction removed and zero yaw, identical turbines have identical free-stream power.
- Yaw decreases own-turbine power while potentially deflecting its downstream wake.
- Duplicated, too-close, out-of-bound, malformed and over-yawed layouts fail closed.
- Held-out model-shift metrics never control combined_score.
known_shortcuts: 'Measured 2026-09-07 against the public-expansion co-design witness (0.741503
  development): row-staggered grids with zero yaw reach 0.137746, pure equal-arc boundary packing
  fails closed (0.000000: the perimeter of the denser farms cannot host every turbine at minimum
  spacing) and uniform fixed-yaw grids score 0.000000. The historical yaw-only search reached
  0.490932 on the pre-2026-09-07 hidden-expansion scoring; no measured low-dimensional layout
  family reaches the witness. The complete objective (wake deficit, RSS superposition, 0.18 floor,
  cos^1.88 yaw loss, 3.6 MW cap, 0.20 structural-load penalty) is public in Task.md; the sealed
  widened-expansion/rotated-direction/turbulence tier remains evaluator-only. The oracle omits
  terrain, electrical balance, availability and loads; clean Linux replay, pinned FLORIS
  comparison and server-held roses remain required.'
