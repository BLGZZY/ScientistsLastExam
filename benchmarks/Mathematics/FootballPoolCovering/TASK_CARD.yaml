  calibrator_model_ids: []
  calibration_runs: []
  calibration_evidence_status: missing
  edits_triggered_by_model: 2026-09-08 local build, before any frontier model saw the task. The
    builder's own red-team cross-check caught the first verifier draft marking radius-1 neighbours
    as idx + 3^i / idx + 2*3^i, which silently carries out of a digit equal to 2 and marks the
    wrong word; replaced with symbol-dependent deltas (+1/+2, -1/+1, -2/-1 for symbols 0/1/2).
    The same carry mistake was made again in the build-time greedy probe and caught by an IndexError,
    which motivated pinning the checker against an independent brute-force Hamming implementation
    in tests/test_footballpoolcovering.py. The malformed-candidate sweep then caught a genuine
    crash path the try/except net missed — a float('nan') or float('inf') symbol reached int(f)
    and raised ValueError/OverflowError out of the oracle; replaced the comparison with float.is_integer(),
    which rejects non-finite values, and pinned NaN/inf rows in the task tests. The same sweep
    caught scalar returns and per-row scalars needing explicit rejection before any iteration,
    and infinite generators needing islice truncation at the 3^n checker cap. No frontier model
    has seen the task; no evaluator change followed any model output. User-directed review revision
    on 2026-09-08 replaced weak-baseline-to-record uncapped scoring with generic-baseline-to-cited-lower-bound
    clipped scoring, shipped attributed reconstruction and diagnostic methods, corrected mathematical
    explanations and malformed numeric handling. Only local development checks were performed;
    no frontier model draw or formal calibration evidence was produced.
  shortcut_discoverer: initial_internal_red_team
  frozen_before_eval: false
  freeze_timestamp: null
