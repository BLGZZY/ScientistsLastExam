schema_version: 2
scientific_question: Joint multi-target recoil law and mass inference with profiled
  speed mixture and controls
artifact: An explicit model or abstention, finite parameter estimates for a supported
  mechanism, and calibrated decision confidence.
oracle:
  model: Poisson counts from coherent momentum-dependent elastic recoil spectra; Gaussian
    nuclear form factor, three isotropic speed components, independent background
    and gain controls
  feasibility: strict typed query and submission validation; per-unit counter-keyed
    sampling; budget overspend permanently invalidates the instance
  deterministic: true
normalization:
  baseline: overconfident legal baseline scores zero; blanket none and blanket abstention
    also score exactly zero
  reference: runnable public-input-only likelihood fit, calibration uncertainty included,
    finite experiment allocation
  score: mean mechanism utility minus the 1/7 blanket refusal utility, divided by
    6/7; false discovery rate, refusal, coverage, confidence and heldout diagnostics
    remain separate
citations:
- id: arxiv:1405.1420
  title: Halo-Independent Direct Detection of Momentum-Dependent Dark Matter
invariants:
- Repeated observation units are independent and charged; splitting a batch preserves
  the same counter-indexed observations.
- The public problem contains no class, split, seed or latent parameter.
- Global random state does not affect the frozen generator.
- Malformed or overspent candidates fail closed without exposing exception text.
- An omitted mechanism is not the same scientific decision as a valid null mechanism.
known_shortcuts: >-
  Revised four-way single-target probe includes null/contact/q2/abstain, all three
  targets, 1/3/12 observation units and 233280 configurations. Measurements and exact
  continuous constant-mass bounds are in references/known_best.md section 4 and the
  revision evidence. Regression gates require even perfect-class constant masses to
  stay at most 0.6 times reference on both splits, and the development-selected
  four-way probe below 0.7 times reference with more than 0.15 absolute separation.
  This finite builder probe is not exhaustive; repository-visible seeds permit
  memorization outside the sandbox, and difficulty is not certified.
review:
  domain: pending_external
  evaluator_security: automated_checks_passed_pending_external_review
provenance:
  class: procedural
  target_source: Original bounded simulator with counter-seeded development and heldout
    instances; no human data or reported particle discoveries.
  task_contract_public_before_evaluation: true
  fresh_confirmation_status: not_completed
novelty_risk:
  level: medium
  rationale: Known scientific inference methods in a new budgeted coupling of controls,
    mechanism alternatives, and misspecification. Closest is Gravitation/PTAHellingsDowns
    (paid mechanism decisions and refusal); this task adds continuous mass recovery
    from nuclear-target energy spectra instead of pulsar-pair angular correlations.
    The simulator is an abstraction, not a validated model of the unresolved fundamental
    question.
